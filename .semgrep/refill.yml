# Refill custom Semgrep rules for TS/JS (spec §8.4, §8.5; ADR 0005, 0006).
#   scripts/semgrep.sh scan       scan the repo with the pinned image (what CI runs)
#   scripts/semgrep.sh selftest   run the rule tests in .semgrep/tests and the path checks
#
# "Global object" prefixes (window., self., globalThis.) and bracket spellings (x["prop"]) are
# covered via metavariable-regex on the callee/receiver text. Svelte files are covered by
# refill-svelte.yml. Known limit: aliasing (`const f = fetch`, `const {subtle} = crypto`) is
# not caught.
rules:
  - id: refill-no-network
    severity: ERROR
    languages: [typescript, javascript]
    message: >-
      Refill is local-only: no network APIs (fetch, XMLHttpRequest, WebSocket,
      EventSource, sendBeacon) anywhere in src/.
    paths:
      include: ["/src/**"]
    pattern-either:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?:(?:window|self|globalThis)\s*\.\s*)*(?:fetch|navigator\s*(?:\.\s*sendBeacon|\[\s*["']sendBeacon["']\s*\]))$|^(?:window|self|globalThis)\s*\[\s*["']fetch["']\s*\]$
      - patterns:
          - pattern: new $C(...)
          - metavariable-regex:
              metavariable: $C
              regex: |-
                ^(?:(?:window|self|globalThis)\s*\.\s*)*(?:XMLHttpRequest|WebSocket|EventSource)$

  - id: refill-no-html-sinks
    severity: ERROR
    languages: [typescript, javascript]
    message: >-
      HTML-string sinks are banned (innerHTML, outerHTML, insertAdjacentHTML, setHTMLUnsafe,
      parseHTMLUnsafe, document.write/writeln). Build DOM with createElement/textContent.
    paths:
      include: ["/src/**"]
    pattern-either:
      - pattern: $X.innerHTML = ...
      - pattern: $X.innerHTML += ...
      - pattern: $X.outerHTML = ...
      - pattern: $X.outerHTML += ...
      - pattern: $X["innerHTML"] = ...
      - pattern: $X["innerHTML"] += ...
      - pattern: $X["outerHTML"] = ...
      - pattern: $X["outerHTML"] += ...
      - pattern: $X.insertAdjacentHTML(...)
      - pattern: $X["insertAdjacentHTML"](...)
      - pattern: $X.setHTMLUnsafe(...)
      - pattern: $X["setHTMLUnsafe"](...)
      - pattern: $X.parseHTMLUnsafe(...)
      - pattern: $X["parseHTMLUnsafe"](...)
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?:(?:window|self|globalThis)\s*\.\s*)*document\s*(?:\.\s*(?:write|writeln)|\[\s*["'](?:write|writeln)["']\s*\])$

  - id: refill-no-eval
    severity: ERROR
    languages: [typescript, javascript]
    message: >-
      Dynamic code evaluation is banned (eval, Function constructor, string timers).
    paths:
      include: ["/src/**"]
    pattern-either:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?:(?:window|self|globalThis)\s*\.\s*)*(?:eval|Function)$|^(?:window|self|globalThis)\s*\[\s*["'](?:eval|Function)["']\s*\]$
      - patterns:
          - pattern: new $C(...)
          - metavariable-regex:
              metavariable: $C
              regex: |-
                ^(?:(?:window|self|globalThis)\s*\.\s*)*Function$
      - patterns:
          - pattern-either:
              - pattern: $F("...", ...)
              - pattern: $F(`...`, ...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?:(?:window|self|globalThis)\s*\.\s*)*(?:setTimeout|setInterval)$

  - id: refill-no-sync-storage
    severity: ERROR
    languages: [typescript, javascript]
    message: >-
      storage.sync is banned: data must never leave the device (it syncs to the
      user's Google account).
    paths:
      include: ["/src/**"]
    pattern-either:
      - pattern: $B.storage.sync
      - pattern: $B.storage["sync"]
      - pattern: $B["storage"]["sync"]
      - pattern: $B["storage"].sync

  - id: refill-subtle-only-in-crypto
    severity: ERROR
    languages: [typescript, javascript]
    message: crypto.subtle may only be used inside src/lib/crypto/.
    paths:
      include: ["/src/**"]
      exclude: ["/src/lib/crypto/**"]
    pattern-either:
      - pattern: crypto.subtle
      - pattern: $X.crypto.subtle
      - pattern: crypto["subtle"]
      - pattern: $X.crypto["subtle"]

  - id: refill-storage-local-only-in-store
    severity: ERROR
    languages: [typescript, javascript]
    message: >-
      storage.local may only be used inside src/lib/store/ (single write queue).
    paths:
      include: ["/src/**"]
      exclude: ["/src/lib/store/**"]
    patterns:
      - pattern-either:
          - pattern: $B.storage.local
          - pattern: $B.storage["local"]
          - pattern: $B["storage"]["local"]
          - pattern: $B["storage"].local
      - metavariable-regex:
          metavariable: $B
          regex: ^(?:.+\.)?(?:chrome|browser)$
