<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account</title>
  </head>
  <body>
    <h1>Account settings</h1>
    <!-- Served at /account: same origin as the bill pages, outside every e2e profile's path prefix.
         One control matches a recorded field (City on the twins page, Account number on the SPA
         rewrite page) among controls no recording has, so the page does not look like either form
         (Jaccard < 0.5) and nothing fills here (ADR 0034). -->
    <form action="/account" method="post">
      <p>
        <label>Display name <input name="display" /></label>
      </p>
      <p>
        <label>Email <input type="email" name="email" /></label>
      </p>
      <p><label for="id1">Account number</label> <input id="id1" /></p>
      <p>
        <label>City <input name="city" /></label>
      </p>
      <p>
        <label>Phone <input type="tel" name="phone" /></label>
      </p>
    </form>
  </body>
</html>
