<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frame named chrome</title>
  </head>
  <body>
    <h1>Billing address</h1>
    <!-- A frame named "chrome": on a fresh load, window named access makes `chrome` this frame's
         window, also in the content script's isolated world. Refill refuses it and does nothing
         on this page (fails closed). -->
    <iframe name="chrome" title="empty"></iframe>
    <form action="/billpay/twins" method="post">
      <p>
        <label>Address 1 <input name="address" /></label>
      </p>
      <p>
        <label>Address 2 <input name="address" /></label>
      </p>
      <p>
        <label>City <input name="city" /></label>
      </p>
    </form>
  </body>
</html>
