name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by full commit SHA (ADR 0005).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format (Prettier)
        timeout-minutes: 2
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # No --with-deps (ADR 0009): ubuntu-latest already ships Chromium's shared libraries, and
      # --with-deps ran apt-get for fonts only, which stalled for 12-15 min on a slow mirror.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Unit tests
        run: pnpm test

      # ADR 0019: real-DOM tests in headless Chromium (Vitest browser mode).
      - name: Browser tests
        timeout-minutes: 5
        run: pnpm test:browser

      - name: Manifest / CSP snapshot
        run: pnpm test:manifest

      - name: Reproducible build (two clean builds hash identically)
        run: |
          rm -rf .output
          pnpm build
          node scripts/hash-dir.mjs .output/chrome-mv3 > a.txt
          rm -rf .output
          pnpm build
          node scripts/hash-dir.mjs .output/chrome-mv3 > b.txt
          cat a.txt b.txt
          diff a.txt b.txt

      # Bundle-level twin of the Semgrep network ban (ADR 0016): no network API token in the shipped JS.
      - name: Built output has no network APIs
        run: pnpm check:built-network

      # ADR 0017: e2e-only seams (every identifier contains __refillE2E) must be absent from the shipped build.
      - name: Production build has no e2e seams
        run: node scripts/check-no-seams.mjs .output/chrome-mv3

      # The worker bundle must stay DOM-free: DOM modules capture prototypes at import and would throw at worker startup.
      - name: Service-worker bundle is DOM-free
        run: |
          sw="$(node -p "require('./.output/chrome-mv3/manifest.json').background.service_worker")"
          node scripts/check-sw-no-dom.mjs ".output/chrome-mv3/$sw"

      # react, react-dom and vue are devDependencies for browser-mode fill tests only (ADR 0024): none of them may ship.
      - name: Production build has no React/Vue
        run: pnpm check:no-frameworks

      # scripts/semgrep.sh runs the digest-pinned image (ADR 0005). selftest proves the rules
      # still bite (rule tests + path include/exclude); scan is the gate (ADR 0006).
      - name: Semgrep rule self-test
        run: scripts/semgrep.sh selftest

      - name: Semgrep (custom Refill rules)
        run: scripts/semgrep.sh scan

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: --lockfile=pnpm-lock.yaml

      - name: pnpm audit
        run: pnpm audit --audit-level high

      # ADR 0017: e2e runs against the e2e build (production code plus pre-granted fixture hosts).
      - name: Build extension for e2e
        timeout-minutes: 5
        run: pnpm build:e2e

      # ADR 0022 positive control: the e2e build must trip the seam check (exit 1, not a usage
      # error), proving the marker survives minification and the production pass above means something.
      - name: E2E build has the seam marker (positive control)
        run: |
          code=0
          node scripts/check-no-seams.mjs .output/chrome-mv3-e2e || code=$?
          test "$code" -eq 1

      - name: Playwright e2e
        timeout-minutes: 8
        run: pnpm test:e2e
