name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by full commit SHA (ADR 0005).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Manifest / CSP snapshot
        run: pnpm test:manifest

      - name: Reproducible build (two clean builds hash identically)
        run: |
          rm -rf .output
          pnpm build
          node scripts/hash-dir.mjs .output/chrome-mv3 > a.txt
          rm -rf .output
          pnpm build
          node scripts/hash-dir.mjs .output/chrome-mv3 > b.txt
          cat a.txt b.txt
          diff a.txt b.txt

      # scripts/semgrep.sh runs the digest-pinned image (ADR 0005). selftest proves the rules
      # still bite (rule tests + path include/exclude); scan is the gate (ADR 0006).
      - name: Semgrep rule self-test
        run: scripts/semgrep.sh selftest

      - name: Semgrep (custom Refill rules)
        run: scripts/semgrep.sh scan

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: --lockfile=pnpm-lock.yaml

      - name: pnpm audit
        run: pnpm audit --audit-level high

      # No --with-deps (ADR 0009): ubuntu-latest already ships Chromium's shared libraries, and
      # --with-deps ran apt-get for fonts only, which stalled for 12-15 min on a slow mirror.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Build extension for e2e
        timeout-minutes: 5
        run: pnpm build

      - name: Playwright e2e
        timeout-minutes: 8
        run: pnpm test:e2e
